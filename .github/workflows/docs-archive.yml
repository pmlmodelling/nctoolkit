# Snapshots docs-site/api.html into docs-site/archive/vX.Y.Z/ whenever a
# GitHub Release is created, so the API reference stays browsable as it
# stood at old releases even after newer releases move the "latest" docs
# on. X.Y.Z is read from setup.py (the source of truth for the version
# being released), not from the release's tag name.
#
# Only that one page is archived - the rest of the site (installing,
# quickstart, the User Guide subpages, data-formats, backends, qa, about,
# the cheat sheet, etc.) isn't meaningfully version-specific, and archiving
# every page of every release indefinitely doesn't scale. The snapshot's
# nav is simplified to just a "Version history" link, and any link to a
# page that isn't archived (including index.html and version-history.html
# itself, neither of which is version-specific) is rewritten to point at
# the live copy instead of 404ing inside the snapshot.
#
# This workflow pushes to master using the default GITHUB_TOKEN, which does
# NOT trigger other workflows via the push event - so it explicitly
# dispatches pages.yml afterwards rather than relying on that push to do it.
name: Archive docs on release

on:
  release:
    types: [created]

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve the version being released
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP "version='\K[^']+" setup.py)
          if [ -z "$version" ]; then
            echo "Could not read a version out of setup.py" >&2
            exit 1
          fi
          echo "Releasing version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Snapshot the current docs
        id: snapshot
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dest="docs-site/archive/v${version}"

          if [ -d "$dest" ]; then
            echo "$dest already exists, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$dest"
          # Only the API reference is archived - see the file-level comment
          # above for why.
          cp docs-site/api.html "$dest"/
          cp -r docs-site/assets "$dest"/

          # Simplify the nav down to just "Version history" (every other
          # page it used to link to isn't in this snapshot), and repoint any
          # link to one of them - including index.html and
          # version-history.html, neither of which is version-specific - at
          # the live copy instead of leaving a link that would 404 here.
          python3 - "$dest" <<'PY'
          import re
          import sys
          from pathlib import Path

          dest = Path(sys.argv[1])
          live_only_pages = [
              "index.html", "about.html", "adding.html", "backends.html",
              "cheatsheet.html", "data-formats.html", "datasets.html",
              "ensembles.html", "exporting.html", "globals.html", "guide.html",
              "hacks.html", "installing.html", "interpolation.html",
              "matchpoint.html", "news.html", "parallel.html", "qa.html",
              "quickstart.html", "subsetting.html", "temporals.html",
              "troubleshoot.html", "variables.html", "verticals.html",
              "visualization.html", "version-history.html",
          ]
          nav_re = re.compile(r'<nav class="nav-links" id="nav-links">.*?</nav>', re.S)
          simplified_nav = (
              '<nav class="nav-links" id="nav-links">\n'
              '      <a href="version-history.html" data-page="version-history.html">Version history</a>\n'
              '    </nav>'
          )

          for page in dest.glob("*.html"):
              html = page.read_text()
              html, n = nav_re.subn(simplified_nav, html)
              if n != 1:
                  raise SystemExit(f"Expected one nav-links block in {page}, found {n}")
              for name in live_only_pages:
                  html = html.replace(f'href="{name}', f'href="../../{name}')
              page.write_text(html)
          PY

          # Freeze the header version badge: it must keep showing v${version}
          # forever, not pick up whatever the live PyPI version becomes later
          # (main.js re-fetches that client-side, keyed on the
          # nctoolkit-docs-version id - drop the id so it's left alone here).
          sed -i "s#<span id=\"nctoolkit-docs-version\" class=\"brand-version\">v\&hellip;</span>#<span class=\"brand-version\">v${version} (archived)</span>#g" "$dest"/*.html

          # Keep archived snapshots out of search results; the live docs are
          # the canonical version to index.
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, follow">#' "$dest"/*.html

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update version-history.html and versions.json
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          archive_dir = pathlib.Path("docs-site/archive")
          versions_path = archive_dir / "versions.json"

          versions = json.loads(versions_path.read_text()) if versions_path.exists() else []
          if version not in versions:
              versions.insert(0, version)
          versions_path.write_text(json.dumps(versions, indent=2) + "\n")

          if versions:
              items = "\n".join(
                  f'      <li><a href="archive/v{v}/api.html">v{v}</a></li>' for v in versions
              )
              body = f'    <ul class="version-history-list">\n{items}\n    </ul>'
          else:
              body = (
                  '    <p style="text-align:center; color:var(--muted-light);">'
                  "No versions are archived yet &mdash; check back after the "
                  "next release.</p>"
              )

          page_path = pathlib.Path("docs-site/version-history.html")
          page = page_path.read_text()
          start_marker = "<!-- NCTOOLKIT_VERSION_HISTORY_START"
          end_marker = "<!-- NCTOOLKIT_VERSION_HISTORY_END -->"
          pattern = re.compile(
              re.escape(start_marker) + r".*?" + re.escape(end_marker), re.S
          )
          replacement = (
              f"{start_marker}: regenerated by .github/workflows/docs-archive.yml, "
              f"don't hand-edit between these markers -->\n{body}\n    {end_marker}"
          )
          new_page, n = pattern.subn(replacement, page)
          if n != 1:
              raise SystemExit(
                  "Expected exactly one NCTOOLKIT_VERSION_HISTORY marker pair "
                  f"in {page_path}, found {n}"
              )
          page_path.write_text(new_page)
          PY

      - name: Commit and push the snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/archive docs-site/version-history.html
          git commit -m "Archive docs for v${{ steps.version.outputs.version }}"
          git push origin master

      - name: Trigger the Pages deploy
        # A GITHUB_TOKEN push doesn't itself trigger pages.yml's push
        # trigger, so ask it to run directly instead.
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"master"}'
