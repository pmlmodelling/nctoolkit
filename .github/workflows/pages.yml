# Simple workflow for deploying the docs-site/ static content to GitHub Pages.
# This is the only Pages workflow in the repo - do not add a second one that
# uploads path: '.', it will race this one and publish the wrong content
# (this file used to do exactly that, as static.yml, before being scoped
# down to docs-site/ - see docs-site/README.md for the full write-up).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch that touch the site source
  push:
    branches: ["master"]
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the site source, not the whole package repo
          path: "docs-site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
