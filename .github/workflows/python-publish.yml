# Builds and uploads the package to PyPI when a GitHub Release is created.
name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check the distributions
      run: |
        twine check dist/*
        ls -l dist
        # PyPI rejects files over 100 MiB. Fail before uploading anything, so a
        # bad sdist can't leave a release half-published (wheel only).
        if [ -n "$(find dist -type f -size +90M)" ]; then
          echo "A distribution exceeds 90 MB; PyPI's limit is 100 MiB." >&2
          exit 1
        fi
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
