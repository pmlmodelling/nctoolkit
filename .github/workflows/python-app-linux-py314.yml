# This workflow will install Python dependencies and run tests with Python 3.14
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Linux tests (Python 3.14)

defaults:
  run:
    shell: bash -l {0}

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          micromamba-version: '1.4.5-0'
          environment-name: foo
          create-args: cdo nco cartopy python=3.14
          init-shell: >-
            bash
          cache-environment: true
          post-cleanup: 'all'
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pip install numpy
          pip install dask
          python -m pip install .
          pip install pandas
          pip install rioxarray
          pip install pytest
          pip install pytest-cov
          pip install coverage

      - name: Test with pytest
        run: |
          python testing/test_parallel.py
          coverage run -m pytest tests/test*.py
          coverage report
