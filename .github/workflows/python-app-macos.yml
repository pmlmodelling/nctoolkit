# Runs the repo's tests against the released nctoolkit 1.2.7 from conda-forge
# (not the code in this checkout).

name: macOS tests

defaults:
  run:
    shell: bash -l {0}

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    # conda-forge only has an Intel (osx-64) build of nctoolkit 1.2.7; the
    # osx-arm64 channel stops at 0.2.2, so macos-latest (Apple Silicon) can't
    # install it.
    runs-on: "macos-15-intel"

    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.4.5-0'
          environment-name: foo
          # nctoolkit's conda package pulls in nco, cartopy, pandas, xarray etc.
          # rioxarray is only needed by the open_geotiff test.
          create-args: nctoolkit=1.2.7 cdo=2.4.0 pytest rioxarray python=3.11
          init-shell: >-
            bash
          cache-environment: true
          post-cleanup: 'all'

      - name: Check the conda-forge release is the one under test
        # Run from outside the checkout, so the repo's nctoolkit/ source
        # directory can't shadow the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import nctoolkit, sys; print(nctoolkit.__version__, nctoolkit.__file__); assert nctoolkit.__version__ == '1.2.7'; assert 'site-packages' in nctoolkit.__file__"

      - name: Test with pytest
        # Plain `pytest`, not `python -m pytest`: `-m` puts the current
        # directory on sys.path, which would import the checkout's nctoolkit/
        # source instead of the conda-forge package.
        # testing/test_parallel.py is not run here: nctoolkit 1.2.7 leaves
        # multiprocessing pools to the garbage collector with workers that
        # ignore SIGTERM, so it can intermittently hang. Fixed in the source,
        # but this workflow tests the 1.2.7 release.
        run: |
          pytest tests/test*.py
